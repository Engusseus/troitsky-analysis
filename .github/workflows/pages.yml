# Publishes the in-browser app (stlite) to GitHub Pages.
# MANUAL ONLY: it runs when someone presses "Run workflow" in the Actions tab, and only
# after GitHub Pages is enabled in the repository settings (Source: GitHub Actions).
# See docs/web-spike.md.
name: Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site && cp web/index.html _site/
          paths=$(find app src/bridgesim rules materials examples web/stlite_entry.py -type f \
                    \( -name '*.py' -o -name '*.yaml' \) -not -path '*/__pycache__/*' \
                    -not -name 'cli.py' | sort)
          for p in $paths; do mkdir -p "_site/$(dirname "$p")"; cp "$p" "_site/$p"; done
          printf '%s\n' $paths | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))' > _site/files.json
          cat _site/files.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check src app tests
      - name: Tests (pytest)
        run: uv run pytest -q
      - name: CLI end to end
        run: |
          uv run bridgesim run examples/warren_2027.yaml --out out
          uv run bridgesim check examples/warren_2027.yaml

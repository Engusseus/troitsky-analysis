[project]
name = "bridgesim"
version = "0.1.0"
description = "Open-source 3D frame analysis and rule checking for Troitsky popsicle-stick bridges"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "bridgesim contributors" }]
keywords = ["structural analysis", "FEA", "truss", "bridge", "Troitsky", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Pinned exactly: Pynite has had breaking API renames between releases.
    "PyniteFEA==3.2.0",
    "numpy>=2.0",
    "scipy>=1.11",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "typer>=0.12",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]

[project.scripts]
bridgesim = "bridgesim.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridgesim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741", "SIM300"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "bridgesim/data/rules"
"materials" = "bridgesim/data/materials"
"examples" = "bridgesim/data/examples"

[tool.ruff.lint.per-file-ignores]
"web/stlite_entry.py" = ["F704", "PLE1142"]

# Parameters of the nonlinear crush simulation (bridgesim.sim) that the linear analysis
# does not need. The wood's E, G, density and strengths along the grain still come from
# the material file (materials/popsicle_birch.yaml) so there is one place to put your
# measurements.
#
# EVERY VALUE IS A PLACEHOLDER (source: assumed) unless you measured it. Each `note` says
# how to measure it; enter your values here or as `params:` in an overrides file.
# (`bridgesim calibrate` fits E, the strengths and the glue strength of the *material*
# file from the CSV templates in validation/physical/, not the values below.
# `bridgesim sensitivity` shows which of them matter for your design.)
# Units: mm, N, MPa (= N/mm^2), N/mm^3, N/mm, kg.
name: Troitsky crush simulation defaults (placeholder)

wood:
  E_placeholder_MPa: {value: 10500, source: assumed,
                      note: "Stick modulus the crush uses while the material's E is a placeholder (source: assumed); G is taken as E/16. Dry craft sticks are about 11-15 GPa: Sautel et al. (Am. J. Phys. 85, 783 (2017), Table I) measured the wave speed of 2.2 mm birch sticks by vibration, c0 = 4600 m/s, E = rho c0^2 = 11.6-14.8 GPa at 550-700 kg/m^3 (their 5.0 GPa was for sticks soaked in water for three weeks); 2 mm rotary-cut birch veneer 14.6 GPa (Kruger et al. 2025); clear birch 11-15 GPa (USDA Wood Handbook). The 7.1 GPa used until round 17 (a stick weighted at a table edge, Emergent Scientist 1, 3 (2017)) reads low: the edge lets it turn. A modulus from vibration (dynamic) reads 5-10 % above the static one a test of a minute loads: 10.5 GPa here, the low end of dry sticks' static modulus. Measure: hang a stick on two threads at 0.224 L from its ends, tap it and read its first frequency f with a phone; E = 0.9465 m f^2 L^3 / (b h^3) (with 650 kg/m^3: ~680 Hz at 12 GPa, ~640 Hz at 10.5 GPa, ~520 Hz at 7 GPa; weigh the stick for m), or bend it (stick_bending_template.csv). A measured E (calibrate, or material.E_MPa in the overrides) replaces it; 0 keeps the material file's value."}
  E_T_MPa: {value: 500, source: assumed,
            note: "Modulus across the grain of one stick. Birch: about E_L/20."}
  nu_LT: {value: 0.35, source: assumed, note: "Major Poisson ratio of one ply."}
  f_t90_MPa: {value: 1.5, source: assumed,
              note: "Tension across the grain of a stick or a ply (sticks glued edge to edge part at about the same). 2 mm birch veneer: 2.0 MPa (CoV 13 %), 1 mm 1.1, 3 mm 1.4 (Kruger et al. 2025, doi:10.5281/zenodo.17201843); lathe checks on one face of a rotary-cut stick lower it. It also caps the peel strength of a glue line (glue.peel_to_shear)."}
  t90_weibull_m: {value: 8, source: assumed,
                  note: "Size effect of the tension across the grain where a glue line pulls on a small volume of wood: f_t90 x (4800 mm^3 / V)^(1/m), V = the joint's area x 2 mm, at least 1, at most 2.5 (idealize.t90_size_factor); it caps the peel of a glue line and an end-grain joint pulled apart. Birch veneer pulled across the grain (80 x 30 mm field) scatters with CoV 25 / 12.6 / 10.8 % at 1 / 2 / 3 mm, m ~ 5 / 9.5 / 11 (Kruger et al. 2025, doi:10.5281/zenodo.17201843); Douglas fir m ~ 5 (Barrett 1974, Wood Fiber 6:126, Eurocode 5's (V0/V)^0.2). A 47 mm^2 joint gets 1.64 x f_t90 at m 8, ~2.5 MPa: a vertical's end grain glued on a chord's side held 2.6 MPa in a published Howe truss (Moraes et al. 2019). 0 turns it off (until round 22). Measure: a T-pull (a stick's end glued flat on another's face) against a stick pulled across its width."}
  f_c90_MPa: {value: 6.0, source: assumed,
              note: "Crushing across the grain, where a member's end bears on another's side, a tenon on its sill, a glue line pressed together. 2 mm birch veneer: 6.9 MPa at about 2 % strain (Kruger et al. 2025); clear birch 4.1-7.4 MPa (USDA Wood Handbook 2010, table 5-3). Measure: press a stack of sticks flat (crush_across_template.csv), the load at 1-2 % deformation."}
  f_rolling_MPa: {value: 3.0, source: assumed,
                  note: "Rolling shear: shear across the grain of a ply, which limits the glue line between crossed plies (0-90, +-45) in a laminated member or plate, and the path round a butt joint through a cross ply. Silver birch about 3.5 MPa, CoV 0.25 (Collins & Fink 2025, doi:10.52202/080513-0265); birch plywood 1.8-2.8 MPa characteristic (UPM WISA DoP UPM022CPR), means ~1.4x that; softwood 1-1.5 (EN 16351)."}
  G_f_N_per_mm: {value: 8.0, source: assumed,
                 note: "Fracture energy of a stick breaking in tension along the grain, a crack across the fibres (sets how suddenly it snaps): Sitka spruce 6.5-18 N/mm (edge-notched strips 0.65, bending specimens 0.9-1.8 x 10^4 J/m^2, Jeronimidis 1976, Leiden Bot. Ser. 3:253); birch, denser, at least as high; lathe checks may lower it in sticks. Measure it with an edge-notched stick in tension (K_Ic, G = K^2 / E), not from the load-extension curve of a plain stick, whose fall after the peak is unstable."}
  G_f90_N_per_mm: {value: 0.45, source: assumed,
                   note: "Fracture energy of a ply parting across the grain (sticks separating edge to edge, or splitting along the grain). Birch: 0.66 N/mm (CoV 19 %, Jonasson, Danielsson & Serrano 2024, Wood Sci. Technol. 58:1925, doi:10.1007/s00226-024-01595-6), RL 0.47 and TL 0.44 N/mm (Nordtest, 648 kg/m^3, Esbjornsson & Svensson 2024, Lund); spruce 0.22. Lathe checks in rotary-cut sticks argue for the lower end."}
  G_v_N_per_mm: {value: 1.3, source: assumed,
                 note: "Fracture energy of a ply failing in shear along the grain (mode II). Hardwoods 1.15-1.54 N/mm in the end-notched flexure test (Eucalyptus globulus 1.54, CoV 28 %; Pinus pinaster 1.15; Sitka spruce 0.4-0.55: Majano-Majano et al. 2020, Materials 13:745, doi:10.3390/ma13030745). It sets the crack band in shear (2 G G_v / f_v^2, ~28 mm with E 11 GPa) and the strength of plate elements larger than it."}
  fc_proportional: {value: 0.65, source: assumed,
                    note: "Proportional limit of wood in compression along the grain, as a share of f_c: the stress-strain curve is straight to here, then bends over smoothly to f_c (reached at (2 - this) f_c / E), so a member near its crushing strength softens before it crushes (tangent-modulus buckling). Clear wood: 0.6-0.75 (USDA Wood Handbook, fiber stress at proportional limit against maximum crushing strength). 1 = elastic-perfectly plastic. From the load-strain curve of a short stack in compression."}
  crush_softening: {value: 0.3, source: assumed,
                    note: "Compressive strength lost after crushing (0.3 = strength drops to 70 % of f_c)."}
  densification_strain: {value: 0.45, source: assumed,
                         note: "Wood crushed at a glue line or under a load compacts until its cells have collapsed, at about this share of the crushed depth (birch, relative density ~0.4: 0.4-0.5); past it, densified wood is about as stiff as wood across the grain."}
  crush_zone_depth_factor: {value: 3.0, source: assumed,
                            note: "Depth of wood a local load compacts, in thicknesses of the part being crushed (the crushed depth is also at most the part's own extent)."}
  moisture_excess_pct: {value: 0, source: assumed,
                        note: "How many percentage points of moisture content the bridge's wood holds above the coupons its values come from: E and G -2 %, f_c -5.7 %, f_c90 -5 %, f_v -2.4 % per point (USDA Wood Handbook 2010, eq. 5-3, paper birch). A PVA glue line brings ~97 g/m^2 of water (46 % solids at the maker's spread), ~+8 points in an interior 2 mm ply just after laminating, and it evens out only after a week at room temperature (Wood Handbook ch. 10), so members laminated in the last days before the test are 20-35 % weaker in compression. 0 when the members were conditioned as long as the coupons (make the coupons alongside them); weigh a member daily after gluing until its mass is steady to know."}
  rate_exponent: {value: 0.02, source: assumed,
                  note: "How the wood's strength depends on its time to failure (as glue.rate_exponent), for a face through one piece of wood (glue override 'solid'): wood loaded to failure in 1 s is ~10 % stronger than in 5 min, ~4 % per decade (USDA Wood Handbook 2010, ch. 5)."}
  butt_bearing_efficiency: {value: 0.95, source: assumed,
                            note: "Compression strength of a laminated member or stick plate whose butt joints bear (their gap closes before the member is damaged) / that of one without joints: tight butt joints in three 33 mm laminations kept 0.94-0.96 (Dansoh, Koizumi & Hirai 2003, J Wood Sci 49:405). A joint whose gap does not close (wood.butt_open_gap_mm) leaves the member with its butt-joint tension factor in compression too."}
  butt_bear_gap_mm: {value: 0.5, source: assumed,
                     note: "Widest gap at a butt joint that still closes and bears before the member is damaged: in 10-ply laminates of 2 mm veneer, gaps of 0.25 and 0.5 mm closed early after first yield (bending strength +52 % over 1 mm gaps) and 1 mm gaps never did (Berard et al. 2011, J Wood Sci 57:107). Between this and wood.butt_open_gap_mm the compression factor falls linearly."}
  butt_open_gap_mm: {value: 1.0, source: assumed,
                     note: "Gap at a butt joint from which it never closes: the member keeps its butt-joint tension factor in compression (Berard et al. 2011: 1 mm). Rounded stick ends butted together leave ~2 mm at their edges: give butt_gap_mm for such members."}
  butt_tension_efficiency: {value: 0.8, source: assumed,
                            note: "Tension strength of a laminated member or stick plate with butt joints / what the statics of its plies and glue lines give (wood path round the joints, butt_path_capacity). In plies as thin as a stick the glue line cracks from a joint's tips at 24-73 % of the ultimate load and the fracture runs into the plies: net-section estimates hold for veneers of 1/4 in or more, not for 1/10 in (Jung & Murphy 1983, Wood Fiber Sci. 15(2):116); one of three laminations cut kept 0.53 of the tension strength against 0.67 of its section (Dansoh et al. 2003). Pull laminated stick members with and without butt joints (stick_tension_template.csv) to measure it."}

glue:
  K_n_N_per_mm3: {value: 150, source: assumed,
                  note: "Peel (normal) stiffness of a glue line plus the wood next to it, per mm^2 of glued area."}
  K_s_N_per_mm3: {value: 60, source: assumed, note: "Shear stiffness of the glue line per mm^2 (short-term: the first seconds of a lap's load-slip record)."}
  points_per_side: {value: 2, source: numerical,
                    note: "Glue points at least across each side (3 mm or more) of a glued patch between two members: 2 lets a patch resist turning about any axis in its plane, as a glued joint does; 1 puts a patch smaller than an element at one point, a hinge (the model until round 15)."}
  creep_factor: {value: 1.0, source: assumed,
                 note: "Creep of a PVA glue line in shear: under a steady load its slip grows toward (1 + this) x the elastic slip (a Kelvin element in series with K_s), with the retardation time creep_time_s, in physical test time (the jack's travel at crusher.test_rate_mm_per_min). PVA is a thermoplastic and creeps; over the ~1 min a crush test takes it adds a few % to the joints' slip. Measure it with a lap joint held at a constant load (its slip over a few minutes); 0 = no creep."}
  creep_time_s: {value: 600, source: assumed,
                 note: "Retardation time of the glue line's creep (s): how fast the creep slip approaches its final value."}
  interlaminar_MPa: {value: 3.5, source: assumed,
                     note: "Shear strength of the glue line between the plies of a laminated member or plate (clamped or weighted while it cured, long and continuous), as opposed to tau_g, the average over a hand-made lap joint between parts (stress peaks at its ends, partial coverage). On craft sticks it is the checked veneer next to the line that gives way: 3- and 4-ply craft-stick beams glued with Elmer's Glue-All and pressed over their whole length (an anvil, a hydraulic jack as a clamp) failed at 3.7-3.8 MPa of glue-line shear (Karplus 1996, ASEE, Craft Stick Beams, Table 1; their absolute loads fail a beam-theory check, but the glued 4-ply held 0.46 of a solid birch beam of its size, ~0.46 f_v, an upper bound), so 3.5 for plies clamped or weighted by hand: hand pressure alone costs ~5-10 % against the optimum on maple (Rabiej & Behm 1992, Wood Fiber Sci. 24(3):260), uneven fit more (sanding the faces flat raised hobby stick bridges 44 %, Boon 2024, garrettsbridges.com); prior 2-4.5; birch veneer bond lines 3-5.5 MPa with the lathe checks open or closed (Rohumaa et al. 2013, Holzforschung 67(7)); a pressed PVAc line on clear beech fails in the wood at >= 10 MPa (EN 204/205). A member's plies split at the lower of this and what each ply takes at its grain angle (f_v along the grain, wood.f_rolling_MPa across). Measure it with short-beam shear tests of a 3-5 ply laminate (validation/physical/short_beam_shear_template.csv)."}
  peel_to_shear: {value: 0.66, source: assumed,
                  note: "Peel strength / shear strength of a white-glue line: 0.66 for a pressed PVAc bond line (6.29 / 9.46 MPa, Serrano 2000, Lund, Paper II). On sticks the wood next to the glue parts first: a glue line's peel strength is the lower of this times its shear strength and the wood's tension across the face (wood.f_t90_MPa, along the grain for end grain), so a stronger glue does not make a lap stronger in peel than its sticks."}
  G_Ic_N_per_mm: {value: 0.25, source: assumed,
                  note: "Fracture energy, opening (peel). On 2 mm sticks the crack runs in the wood along the grain: K_Ic 0.25-0.52 MPa m^0.5 (USDA Wood Handbook 2010, table 5-10), i.e. 0.1-0.4 N/mm."}
  G_IIc_N_per_mm: {value: 1.2, source: assumed,
                   note: "Fracture energy, sliding (shear). A pressed PVAc bond line: 2.08 N/mm with its pre-peak plastic work (Serrano 2000, Lund); wood along the grain in mode II about 1 N/mm (K_IIc ~2 MPa m^0.5, USDA Wood Handbook table 5-10). It sets how much of tau_g x area a long lap carries (generalised Volkersen: the longer the lap and the lower G_IIc, the smaller that share; the simulated laps follow it within 12 %, validation README 3.9). From the load-slip record of a lap test (lap_slip_template.csv)."}
  end_grain_factor: {value: 0.5, source: assumed,
                     note: "Strength of a glue line on end grain (a member's end, a plate's edge) / on side grain. End grain soaks up the glue and starves the line: 0.2-0.6 without sizing (USDA Wood Handbook 2021 ch. 10: end-grain butt joints reach about a quarter of the wood's tension strength 'even with special techniques'); a first coat of glue to size the end grain helps. Glue two sticks end to end and pull them apart, or glue a stick's end flat on another's face and shear it (end_grain_template.csv)."}
  rate_exponent: {value: 0.1, source: assumed,
                  note: "How a glue line's strength depends on its time to failure: tau(t) = tau(t_ref) (t / t_ref)^-n, t_ref the time to failure of the lap tests tau_g describes (glue.coupon_time_s). PVAc is a thermoplastic: +20 % at 16x the rate, i.e. ~+16 % per decade (n ~0.065; Wernersson 1994, Lund TVSM-1006, Table 4.1), -40 % at a tenth of the rate (n ~0.22; Serrano 2000, Lund TVSM-1012, sec. 4.1.1); 0.1 between them is +26 % per decade (10^0.1). In the crush the physical test time runs with the jack at crusher.test_rate_mm_per_min, and at each moment the glue holds what a test failing then would show: a bridge that peaks 17 s into a test (Bridge_v10) is ~13 % stronger at its glue than 60 s coupons, one at 6 s (a light truss) ~26 %. While tau_g is a placeholder its coupon time is a convention: on Bridge_v10 the law adds ~5 % to F_u against n = 0. Pull laps that fail in ~10 s, ~60 s and ~600 s (5 each, glue_joint_template.csv with time_to_failure_s) to measure it."}
  coupon_time_s: {value: 60, source: assumed,
                  note: "Time to failure of the lap tests tau_g describes (the placeholder's: a lap pulled to failure in about a minute). Give each test's time_to_failure_s in glue_joint_template.csv and calibrate brings every test to this time (glue.rate_exponent)."}
  prepeak_onset: {value: 0.65, source: assumed,
                  note: "The glue law's shape before its peak: a glue line is straight (K_s, K_n) up to this share of its strength, then bends over to the strength at glue.peak_slip_ratio x the slip a straight line would reach it at, and softens linearly to nothing where it has taken G_Ic / G_IIc (a trilinear law; the toughness is unchanged). A pressed PVAc bond line's load-slip curve bends from about 60-75 % of its peak (Serrano 2000, Lund TVSM-1012, Fig. 4.10 and 4.28; 0.4-0.75 in Wernersson 1994, lower in slower tests): PVA is a thermoplastic and yields before it parts. 1 with peak_slip_ratio 1 is the bilinear law (until round 20). From the load-slip record of a lap test (lap_slip_template.csv)."}
  peak_slip_ratio: {value: 2.0, source: assumed,
                    note: "Slip at a glue line's peak / the slip a straight line of slope K_s would reach the strength at. Pressed PVAc lines peak at 0.05-0.07 mm, ~2.5x the slip of their own initial slope (Serrano 2000, Fig. 4.10, Casco 3326), and at 0.04-0.135 mm with an almost negligible elastic part (Wernersson 1994, Fig. 4.2, Casco 3304): 1.1-3.8 with K_s 60 N/mm^3 and tau_g 2.2 MPa, 2.0 (~0.075 mm) in the middle (1.5 in round 20). From the load-slip record of a lap test (lap_slip_template.csv)."}
  end_grain_tension_factor: {value: 0.1, source: assumed,
                             note: "Strength of a glue line on end grain pulled apart (normal to the end) / the wood's tension strength along the grain: the fibres run along the pull, so an end-grain joint in tension is limited by how far the glue gets into the cut cells, not by the wood across the grain as a side-grain line in peel is. End-grain butt joints reach about a quarter of the wood's tension strength with special techniques (USDA Wood Handbook 2021 ch. 10); a hand-made PVA vertical glued on its end grain to a chord held 2.6 MPa (~0.07 f_t of pine) before it broke in a published Howe truss test (Moraes et al. 2019, validation README 3.14). 0.1: ~4 MPa for craft sticks of f_t 40 MPa, capped by the other part's tension across its face (wood.f_t90_MPa x the size factor of wood.t90_weibull_m) where the end is glued on a side face. Until round 21 the side-grain peel strength x the end-grain factor (0.7 MPa). Glue two sticks end to end and pull them apart (end_grain_template.csv)."}
  cross_grain_ratio: {value: 0.38, source: assumed,
                      note: "Shear strength of a glued lap whose two parts' grains cross at 90 degrees in the glue plane / that of a lap of parallel sticks (the coupon tau_g is measured on): the part loaded across its fibres fails in rolling shear. In between Hankinson's form, ratio / (sin^n + ratio cos^n): 0.81 at 30 degrees, 0.62 at 45, 0.48 at 60 (idealize.lap_crossing_factor; laminations keep glue.interlaminar_MPa, whose plies' angles interlaminar_strength already takes). Pine blocks bonded at 0 / 30 / 45 / 60 / 90 degrees held 10.5 / 8.4 / 6.4 / 5.1 / 3.9 MPa: 0.38, n 2.35 (Padilha et al. 2023, Rev. Arvore 47, doi:10.1590/1806-908820230000027); wood.f_rolling_MPa / f_v gives about the same. 1 turns it off (until round 22). Measure: laps glued at 0, 45 and 90 degrees (glue_joint_template.csv, its grain_angle_deg column)."}
  cross_grain_exponent: {value: 2.35, source: literature,
                         note: "Hankinson exponent of glue.cross_grain_ratio (2.00-2.71, Padilha et al. 2023)."}
  friction: {value: 0.4, source: assumed,
             note: "Wood-on-wood friction once a glue line has broken (pieces still bear and rub)."}
  size_ref_mm2: {value: 200, source: assumed,
                 note: "Area of the lap coupon tau_g is measured on (the 20 x 10 mm single lap of glue_joint_template.csv): laps larger than it are weaker on average (glue.weibull_m). Set it to your coupons' area."}
  weibull_m: {value: 10.0, source: assumed,
              note: "Weibull modulus of the size effect on a hand-made glued lap's average strength: a lap of area A (up to glue.size_cap_mm2) holds (A / size_ref_mm2)^(-1/m) of tau_g (more starved spots and uneven clamping over a larger area): 0.83 for Bridge_v10's 1320 mm^2 gusset laps at m 10. Bonded timber laps follow a Weibull size effect (Tannert, Vallee & Hehl 2012, Wood Sci. Technol. 46:503); the shear lag along a long lap, the other half of a lap's size effect, is in the glue law itself, so m is the statistical part only. Pressed glued crossings of CLT showed no size effect from 1600 to 29,000 mm^2 (torsion 3.59 and 3.46 MPa, Flaig & Blass 2013, CIB-W18 46-12-1), which argues for a mild one: 10, range 6-20 (6 until round 20). Debertolis et al. 2025 (J. Build. Eng. 113:114046) assumed 1-3 MPa for hand-clamped plywood gussets as design inputs (not measured); coupons cut from them held 5.1 MPa, CoV 0.27, on 2500 mm^2. Measure it with laps of two sizes (20 x 10 mm and a gusset-sized 30 x 44 mm), ~30 of each to tell 6 from 10; 0 turns it off."}
  size_cap_mm2: {value: 3000, source: assumed,
                 note: "Largest lap area the size effect is carried to: laps larger than this are as strong per mm^2 as one of this area (the power law is not extrapolated past the laps it describes: Flaig & Blass 2013 found none on 1600-29,000 mm^2 pressed crossings)."}
  lamination_K_s_N_per_mm3: {value: 200, source: assumed,
                             note: "Shear stiffness of the glue line between two plates glued face to face (a deck's plies drawn as separate bodies), pressed flat as the plies inside a laminated body: a pressed PVAc line ~150 N/mm^3 secant to its peak, 300-400 initially (Serrano 2000, Lund TVSM-1012), in series with the shear of two 2 mm sticks through their thickness (~450). Such a line is as strong as the glue lines inside a laminated body (glue.interlaminar_MPa)."}
  plate_edges_glued: {value: 0, source: assumed,
                      note: "Whether the sticks of a 0/90 plate are glued edge to edge (1) or only face to face (0). Unglued, a sheet carries in-plane shear through the glued crossings of its plies, like cross-laminated timber with unglued narrow faces: G* / G0 = 1 / (1 + 6 F (t/a)^2) (~0.65 for 2 mm x 10 mm sticks) and half the shear strength (Bogensperger, Moosbrugger & Silly 2010, WCTE), or less where the glued crossings fail first in torsion: a 2-ply sheet holds 0.83 x a crossing's torsional strength, min(glue.interlaminar_MPa, 2.4 x wood.f_rolling_MPa) (Boggian, Andreolli & Tomasi 2019, Front. Built Environ. 5:58; Flaig & Blass 2013). Glue two sticks crosswise and twist one with a lever (tau_max = 3 M / a^3) to measure a crossing. Load a 100 x 100 mm 2-ply sheet along its diagonal, edges glued and not, to measure it."}
  gap_fill_mm: {value: 0.15, source: assumed,
                note: "Widest gap a white (PVA) glue line fills at full strength (the strongest bond lines are 0.08-0.15 mm, USDA Wood Handbook 2021 ch. 10). Thicker, it shrinks as its water leaves and is weaker: 0.9 at this + 0.1 mm, 0.6 at + 0.35 mm, nothing (dry) from + 0.85 mm (shimmed block shear, Kurt 2006, Wood Res. 51(1):59: -10 % at 0.25, -39 % at 0.48 mm; a 0.4 mm PVAc line carried 1.38 MPa for 70 days, USDA FPL RP-400). A fit-up gap (scatter.bearing_gap_mm) is glued at that strength, dry where too wide. Glue sticks with shims of known thickness (paper, feeler gauges) between them and pull them apart."}
  tau_peak_over_avg: {value: 1.065, source: numerical,
                      note: "Peak cohesive strength / average lap-joint strength tau_g, for a joint whose glue points hang on several nodes per side: the value that makes the simulated 20 x 10 mm single-lap test (bridgesim lab) reproduce tau_g with the glue values above (1.065 since round 21, with the glue law peaking at 2x the straight line's slip; 1.075 at 1.5x, round 20: the pre-peak bend shares the load more evenly along the lap; 1.10 with the bilinear law and G_IIc 1.2 N/mm; 1.155 with G_IIc 0.6). With the glue on 1, 2, 3, 5 and 9 nodes per side the lap needs 1.00, 1.04, 1.09, 1.07 and 1.065, which 1 + (this - 1)(1 - exp(-2.2 (n - 1))) follows within 3 %. tests/test_sim.py checks it with the simulation's own glue values: recompute it whenever they change."}

floss:
  strands: {value: 4, source: assumed,
            note: "Strands of floss in each modelled floss tie (count the passes you actually make)."}
  strand_break_N: {value: 25, source: assumed,
                   note: "Breaking load of one strand of your waxed floss. Hang weights on a strand."}
  strand_EA_N: {value: 300, source: assumed,
               note: "Axial stiffness of one strand (load / strain). From the same hanging test."}

contact:
  friction_platform: {value: 0.35, source: assumed,
                      note: "Wood on the crusher's steel base platform."}
  friction_plate: {value: 0.3, source: assumed, note: "Wood on the steel loading plate."}
  seating_mm: {value: 0.3, source: assumed,
               note: "Depth over which a bearing face beds in on the steel (roughness, glue beads, fibres crushing at the first touch): its contact stiffness grows from 0 to full over this depth, the soft start ('toe') of a real load-deflection curve. Read it off the start of your crush-test curve."}

crusher:
  plate_mass_kg: {value: 4.2, source: assumed,
                  note: "Mass of the loading plates resting on the deck: two 200 x 90 x 15 mm steel plates (Appendix B: 'each is 1.5 cm thick'), 2 x 2.1 kg. Weigh them if you can."}
  jack_diameter_mm: {value: 40, source: assumed, note: "Lower jack rod (Appendix B: 4.0 cm)."}
  stiffness_N_per_mm: {value: 20000, source: assumed,
                       note: "Axial stiffness of the crusher and its load cell between the jack and the frame (it is in the jack-stroke curve, not in the deck deflection). Measure: the jack stroke against the load on a steel block."}
  lateral_N_per_mm: {value: 2000, source: assumed,
                     note: "Sideways stiffness of the jack rod and its hemisphere at the loading plate (how much it holds the plate from sliding along the deck)."}
  frame_clear_width_mm: {value: 1370, source: assumed, note: "Between the press uprights (Appendix B: 137 cm)."}
  test_rate_mm_per_min: {value: 10, source: assumed,
                         note: "Real jack speed at the competition: the physical test time the glue's creep and its rate-dependent strength (glue.rate_exponent) run on, and the replay's real time. Bridge_v10 peaks ~2.9 mm into the jack's travel, ~17 s at 10 mm/min (round 22). Time the jack from a video of the competition (travel of the press head over a few seconds) or from crush_test_template.csv's time_s."}

scatter:
  E_cov: {value: 0.12, source: assumed, note: "Stick-to-stick coefficient of variation of E (from your bending tests)."}
  strength_cov: {value: 0.18, source: assumed, note: "Coefficient of variation of stick strength."}
  E_strength_corr: {value: 0.7, source: assumed,
                    note: "Correlation of a stick's strength with its stiffness (in log terms): stiffer wood is stronger, which is why machine stress grading predicts strength from E (USDA Wood Handbook ch. 6-7: r = 0.6-0.8 between MOE and MOR). Each body's strength factor has the CoV strength_cov and this correlation with its E factor. From paired bending tests (E and strength of each stick: calibrate)."}
  ply_corr: {value: 0.3, source: assumed,
             note: "Correlation between the sticks of one laminated member (same batch, often the same tree). A member of n plies averages its sticks, so its E and strength vary by CoV x sqrt((1 + (n - 1) rho) / n): 0 = independent sticks (CoV / sqrt n), 1 = all alike (no averaging). From the scatter of laminated coupons against single sticks."}
  glue_cov: {value: 0.30, source: assumed, note: "Coefficient of variation of glue-joint strength from joint to joint: workmanship (how much of a face is wetted and in contact, how well it was clamped), not the weakest-link scatter inside one lap that the size effect describes (glue.weibull_m: a modulus of 10 alone would give ~12 %). Pressed lab PVAc lines ~10 % (Wernersson 1994); clamped plywood-gusset coupons 27 % (Debertolis et al. 2025); hand-rubbed maple joints 18.7-26 MPa (Rabiej & Behm 1992); whole hobby stick bridges 6-19 % per group (Boon 2024). A node's weakest joint lets go first, so it moves F_u: on Bridge_v10 0.12 instead of 0.30 raised quick F_u 6-16 % (the adversarial review of round 20). Drawn by montecarlo (0.17-0.53); measure it as the CoV of ten laps glued the way the bridge is."}
  bow_L_over: {value: 400, source: assumed,
               note: "Typical initial bow of a member, as span/bow (L/400). Measure the crookedness of your built members."}
  placement_mm: {value: 3.0, source: assumed, note: "How far off-centre the plate may be placed (each way)."}
  glue_bridge_cov: {value: 0.15, source: assumed,
                    note: "Coefficient of variation of the workmanship of a whole build: one factor on every glue joint of the bridge (glue batch, curing, the builders' hands), on top of the joint-to-joint glue_cov, so repeat builds differ by more than independent joints would make them. From the scatter of whole-bridge or sub-assembly tests."}
  amplitude: {value: 1.0, source: assumed,
              note: "Scale on every seeded imperfection and scatter (bows, lean, support level, plate placement, material and glue scatter, all at once): 1 = the values above; 0.1 = a nearly perfect bridge whose asymmetry is still set by the seed, not by round-off (for an imperfection-sensitivity or mesh study, validation/convergence_study.py --amplitude)."}
  lean_rad: {value: 0.005, source: assumed,
             note: "How far the built bridge leans out of its plane (sway): each seed leans it by up to this angle, either way, the height times the angle at every point (EN 1995-1-1 5.4.4: 0.005 rad). Measure how far the top of your built bridge stands off the vertical."}
  bearing_gap_mm: {value: 0.3, source: assumed,
                   note: "Fit-up of a member's end cut to bear or be glued on another part (an end post on a knee, a tenon on its sill: the joints inspect lists as end grain). A hand-cut end is not square: it touches at one edge and stands off by up to this much at the other, each face by its own amount (seeded, 0 to this value) in its own direction. Where the gap is wider than glue.gap_fill_mm the glue does not bridge it and the face is dry there: it bears only once the gap has closed, the touching edge crushing first. A 1 degree error over a 20 mm deep end is 0.35 mm. Hold the cut ends on their seats and slide feeler gauges (or paper of known thickness) into the gap; 0 if each end is sanded to fit."}
  support_level_mm: {value: 0.5, source: assumed,
                     note: "How far the four support corners of the built bridge are out of one plane: each is lifted by up to this much (seeded), so the bridge rocks on three corners until the load beds it down. Stand the bridge on a flat table and measure the gap under the corner that rocks."}

uncertainty:
  mesh_cov: {value: 0.05, source: assumed,
             note: "Discretisation error of F_u at the standard mesh left after its bias (uncertainty.mesh_bias_standard), as a CoV: fine minus standard over 10 seed pairs ranged -1.1 to +11 % (Bridge_v6, five seeds, +4.6 % on average, validation/README.md 3.4; Bridge_v10 -0.2 % in round 18, +1.6 and +2.9 % in round 19, +1.5 and +3.4 % in round 20). The three meshes are not monotone (standard the lowest of the three on both Bridge_v10 seeds in rounds 19-20; quick / standard / fine 2162 / 2061 / 2093 kgf on seed 0, 2232 / 2000 / 2069 on seed 1), so no Richardson estimate: an empirical scatter. Added to the montecarlo range (total_p05_kgf, total_p95_kgf)."}
  mesh_bias_standard: {value: 0.02, source: assumed,
                       note: "How far fine reads above standard on average: +2.3 % over the 10 seed pairs (fine at or above standard in 7, the 3 others within 1.1 %): taken out of the montecarlo prediction and total range at standard fidelity (fine is not shown converged either: the adversarial review of round 20)."}
  mesh_bias_quick: {value: -0.04, source: assumed,
                    note: "How far fine reads below quick on average: quick 1-8 % above fine on Bridge_v10 (rounds 18-20, 100 mm/s; +6 % at quick's own 200 mm/s), often failing at a competing joint: taken out of the montecarlo prediction at quick fidelity."}
  model_cov: {value: 0.40, source: assumed,
              note: "Model-form error of F_u (as a CoV): what the equations leave out or get wrong for a real bridge, not the material values. Unknown until a physical crush test of the team's own is compared (bridgesim compare). 0.40 since round 22: the published white-glue truss tests rebuilt in validation/published_tests.py (B, C) scatter about the model with a log-sd of 0.42-0.52 (C's failure load read from its text or its curve), and with the 0.30 below as a prior worth a few tests the pooled value is ~0.35-0.40 (Kennedy & O'Hagan 2001; the literature review of round 21); test A (superglue, its node read from photos) at 0.21 of its load is left out as a different glue, which with it would give ~0.56; these are small trusses (members 6-9 mm, joints of tens of mm^2), outside Bridge_v10's range, so they set no bias. Before, 0.30 from how far F_u moves with modelling choices not settled by tests: on Bridge_v10 a small glued patch as a hinge or as a patch that turns (+27 to +42 %), its centre gussets as one beam or as plates (+17 %), its floor beam under the jack rigid or deformable (-9 %), release to release on the same file (1360 to 2154 kgf, as idealisation errors were found and fixed; 2457 in round 17: 14-30 % per release, so 30 % since round 18, the adversarial review). For scale, the JCSS Probabilistic Model Code (part 3.9) gives 10-15 % for mature resistance models of connections that tests have calibrated: not less than that before any test. It also enters the recommended prediction (montecarlo). Replace it with the scatter of compare's F_u errors once you have tests."}
